<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDA Scopus Keyword Heatmap</title>
    <!-- โหลด Plotly & Bootstrap CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 25px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 25px; border: none; }
        #heatmap { width: 100%; height: 680px; }
        .table-responsive { max-height: 500px; overflow-y: auto; }
        .badge-year { font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">EDA & Keyword Heatmap Visualizer</h2>
            <p class="text-muted">Scopus Data Exploration (2020 - 2025)</p>
        </div>

        <div class="card p-3">
            <div id="heatmap"></div>
        </div>

        <div class="card p-4">
            <h4 id="table-title" class="mb-3 text-secondary">📄 Matching Documents</h4>
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 50px;">#</th>
                            <th>Title</th>
                            <th>Authors</th>
                            <th style="width: 80px;">Year</th>
                            <th>Source</th>
                            <th style="width: 100px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="doc-table-body">
                        <tr><td colspan="6" class="text-center text-muted p-4">👈 Click on any cell in the heatmap above to view matching documents.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ฝังชุดข้อมูล JSON ไว้ในแท็ก script พิเศษ เพื่อป้องกัน Syntax Error -->
    <script id="raw-docs-data" type="application/json">[]</script>
    <script id="raw-years-data" type="application/json">[2020, 2021, 2022, 2023, 2024, 2025]</script>
    <script id="raw-keywords-data" type="application/json">[]</script>
    <script id="raw-z-data" type="application/json">[]</script>

    <script>
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        try {
            // ดึงข้อมูลผ่าน JSON.parse จากแท็ก HTML ป้องกันปัญหาตัวอักษรพิเศษ 100%
            const docsData = JSON.parse(document.getElementById('raw-docs-data').textContent);
            const years = JSON.parse(document.getElementById('raw-years-data').textContent);
            const topKeywords = JSON.parse(document.getElementById('raw-keywords-data').textContent);
            const zData = JSON.parse(document.getElementById('raw-z-data').textContent);

            const trace = {
                z: zData,
                x: years.map(String),
                y: topKeywords,
                type: 'heatmap',
                colorscale: 'Viridis',
                hoverongaps: false
            };

            const layout = {
                title: 'Top 25 Keywords Occurrence across Years (2020 - 2025)',
                xaxis: { title: 'Year', type: 'category' },
                yaxis: { title: 'Keywords', automargin: true },
                margin: { l: 180, r: 40, b: 60, t: 60 }
            };

            Plotly.newPlot('heatmap', [trace], layout);

            // เมื่อกดคลิกที่ Heatmap Cell
            document.getElementById('heatmap').on('plotly_click', function(evtData){
                if(!evtData || !evtData.points || !evtData.points.length) return;
                
                const pt = evtData.points[0];
                const selectedKw = pt.y;
                const selectedYear = parseInt(pt.x);

                // กรองบทความที่ตรงกับ Keyword และ Year
                const filteredDocs = docsData.filter(d => 
                    d.year === selectedYear && d.keywords.includes(selectedKw)
                );

                document.getElementById('table-title').innerText = `📄 Documents for "${selectedKw}" in ${selectedYear} (${filteredDocs.length} found)`;

                const tbody = document.getElementById('doc-table-body');
                tbody.innerHTML = '';

                if(filteredDocs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted p-4">No documents found for this selection.</td></tr>';
                    return;
                }

                filteredDocs.forEach((doc, i) => {
                    const safeTitle = escapeHtml(doc.title);
                    const safeAuthors = escapeHtml(doc.authors);
                    const safeSource = escapeHtml(doc.source);
                    const safeLink = escapeHtml(doc.link);

                    const row = `<tr>
                        <td>${i + 1}</td>
                        <td><strong>${safeTitle}</strong></td>
                        <td class="text-muted small">${safeAuthors}</td>
                        <td><span class="badge bg-primary badge-year">${doc.year}</span></td>
                        <td class="small">${safeSource}</td>
                        <td><a href="${safeLink}" target="_blank" class="btn btn-sm btn-outline-primary">View Article</a></td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            });

        } catch (err) {
            console.error("Initialization Error:", err);
            document.getElementById('heatmap').innerHTML = '<div class="alert alert-danger m-3">Error rendering visualizer: ' + err.message + '</div>';
        }
    </script>
</body>
</html>
